name: Publicar internos

on:
  push:
    branches: [main]
    paths: ['produtos/**', 'scripts/**']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['produtos/**', 'scripts/**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: internos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gerar-indice.mjs

      - name: Definir branch de deploy
        id: br
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "nome=main" >> "$GITHUB_OUTPUT"
          else
            echo "nome=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy produtos --project-name=prototipo-int --branch=${{ steps.br.outputs.nome }}

      - name: Comentar ou atualizar link no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marcador = '<!-- previa-cf -->';
            const body = `${marcador}\nPrévia: ${process.env.URL}`;
            const { data: comentarios } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number
            });
            const existente = comentarios.find(c => c.body.includes(marcador));
            if (existente) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existente.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }