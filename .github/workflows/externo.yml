name: Externo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['externo/*.txt']

permissions:
  contents: read

concurrency:
  group: externo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cliente

    steps:
      - uses: actions/checkout@v5

      - name: Montar pacote por cliente
        shell: bash
        run: |
          set -euo pipefail
          rm -rf clientes && mkdir -p clientes

          for LISTA in externo/*.txt; do
            [ -e "$LISTA" ] || continue
            CLIENTE="$(basename "$LISTA" .txt)"
            [[ "$CLIENTE" =~ ^[a-z0-9-]+$ ]] || { echo "Cliente inválido: $CLIENTE"; exit 1; }
            mkdir -p "clientes/$CLIENTE"
            indice=""

            while IFS= read -r CAMINHO || [ -n "$CAMINHO" ]; do
              CAMINHO="${CAMINHO//$'\r'/}"
              if [[ -z "$CAMINHO" || "$CAMINHO" == \#* ]]; then continue; fi

              [[ "$CAMINHO" =~ ^[a-z0-9-]+(/[a-z0-9-]+)*$ ]] || { echo "Caminho inválido: $CAMINHO"; exit 1; }

              ORIGEM="produtos/$CLIENTE/$CAMINHO"
              [ -f "$ORIGEM/index.html" ] || { echo "Não existe: $ORIGEM/index.html"; exit 1; }

              mkdir -p "clientes/$CLIENTE/$CAMINHO"
              cp -r "$ORIGEM/." "clientes/$CLIENTE/$CAMINHO/"
              indice+="<li><a href=\"$CAMINHO/\">$CAMINHO</a></li>"
              echo "[$CLIENTE] incluído: $CAMINHO"
            done < "$LISTA"

            printf '<!doctype html><meta charset="utf-8"><title>Protótipos</title><h1>Protótipos</h1><ul>%s</ul>' "$indice" > "clientes/$CLIENTE/index.html"
          done

          printf '<!doctype html><meta charset="utf-8"><title>Acesso restrito</title>' > clientes/index.html
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > clientes/_headers

      - name: Deploy no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy clientes --project-name=prototipo-ext --branch=main